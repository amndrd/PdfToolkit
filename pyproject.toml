[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "recto"
dynamic = ["version"]
description = "A local-first PDF toolkit — merge, split, rotate, extract, compress and encrypt PDFs entirely on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "amndrd" }]
keywords = [
    "pdf",
    "merge",
    "split",
    "rotate",
    "extract",
    "compress",
    "encrypt",
    "cli",
    "offline",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Typing :: Typed",
]
dependencies = [
    "pypdf[crypto]>=6.21.4",
    "typer>=0.27.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# Compression, linearisation and repair, via qpdf.
optimize = ["pikepdf>=10.13.0.post1"]
# PDF <-> image conversion, via PDFium and Pillow.
images = ["pypdfium2>=5.14.0", "pillow>=12.3.0"]
# The offline drag-and-drop web interface.
web = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]
# Everything.
all = ["recto[optimize,images,web]"]
# Contributor tooling.
dev = [
    "recto[all]",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "httpx>=0.28.1",
]

[project.scripts]
recto = "recto.cli.app:main"

[project.urls]
Homepage = "https://github.com/amndrd/PdfToolkit"
Repository = "https://github.com/amndrd/PdfToolkit"
Issues = "https://github.com/amndrd/PdfToolkit/issues"
Changelog = "https://github.com/amndrd/PdfToolkit/blob/main/CHANGELOG.md"

# --------------------------------------------------------------------------- #
# Build
# --------------------------------------------------------------------------- #

[tool.hatch.version]
path = "src/recto/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/recto"]

[tool.hatch.build.targets.sdist]
include = ["src/recto", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src/recto"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--doctest-modules",
    "--ignore=src/recto/cli",
    "--ignore=src/recto/web",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # Starlette nags about httpx in its own TestClient import.
    "ignore:.*httpx.*:UserWarning",
    "ignore::UserWarning:starlette.*",
]
markers = [
    "slow: tests that take more than a second",
    "optional: requires an optional dependency",
]

[tool.coverage.run]
source = ["recto"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# --------------------------------------------------------------------------- #
# Lint and type-check
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests"]
# Ruff also formats Python inside Markdown fences. In documentation, aligned
# trailing comments are a deliberate readability choice, so prose is left alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
    "PTH",  # prefer pathlib
    "RET",  # return style
]
ignore = [
    "E501",    # line length is the formatter's business
    "B008",    # Typer's whole API is function calls in defaults
    "RUF012",  # ClassVar annotations add noise here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["recto"]

[tool.mypy]
python_version = "3.10"
files = ["src/recto"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
