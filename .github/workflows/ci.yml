name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One newest-Python run; the matrix above is about breadth of OS.
          - os: ubuntu-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest --cov=recto --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  base-install:
    name: Base install has no optional imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install without extras
        run: pip install -e . pytest

      - name: Core commands work
        run: |
          python -c "
          from recto.core import merge, split, rotate, extract
          print('core imports fine without extras')
          "
          recto --version
          recto --help

      - name: Optional features fail with an actionable message
        run: |
          python - <<'PY'
          from recto.errors import MissingDependency
          from recto.core import optimize
          try:
              optimize("x.pdf", "y.pdf")
          except MissingDependency as exc:
              assert "pip install" in str(exc), exc
              print("MissingDependency message is actionable:", exc)
          else:
              raise SystemExit("expected MissingDependency")
          PY

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Mypy
        run: mypy

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
