name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*recto-(.*)\.tar\.gz/\1/')
          if [ "$tag" != "$built" ]; then
            echo "::error::tag v$tag does not match built version $built"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Attach to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Publishing to PyPI is opt-in. To enable it:
  #   1. Create the project on PyPI and configure a Trusted Publisher for this
  #      repository and the workflow file name `release.yml`.
  #   2. Create a GitHub environment named `pypi`.
  #   3. Delete the `if: false` line below.
  # Until then, releases are GitHub-only and `pip install git+...` works.
  pypi:
    name: Publish to PyPI
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
