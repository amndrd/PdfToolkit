name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The most useful thing you can include is the
        exact command and the full error message.

  - type: textarea
    id: command
    attributes:
      label: What did you run?
      description: The exact command, or the Python code.
      render: console
      placeholder: recto split report.pdf -o parts/ --outline
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the full output, including any traceback.
      render: console
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Recto version
      description: Output of `recto --version`
      placeholder: recto 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: macOS 15.2, Python 3.12.4
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: The PDF, if one is involved
      description: |
        PDFs in the wild are gloriously malformed, and a real file that breaks
        Recto is worth more than any description of one. If you can attach it,
        please do.

        If it is sensitive, don't — paste the output of
        `recto info yourfile.pdf --json` instead, which contains no page
        content.
